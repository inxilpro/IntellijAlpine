# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [ prereleased, released ]

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Upload an artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*

  # Open a pull request against the default branch that files the release notes under the
  # published version and bumps the version, so the default branch never sits on a version
  # that has already shipped. Skipped for pre-releases, which keep iterating the same version.
  postRelease:
    name: Post-release update
    needs: [ release ]
    if: github.event.action == 'released' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Check out the default branch rather than the release tag, so the pull request only
      # contains these updates and does not revert anything merged since the tag
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Move the release notes out of the Unreleased section and into the published version
      - name: Patch Changelog
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          if [ -n "$CHANGELOG" ]; then
            RELEASE_NOTE="./build/tmp/release_note.txt"
            mkdir -p "$(dirname "$RELEASE_NOTE")"
            echo "$CHANGELOG" > $RELEASE_NOTE

            ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE
          else
            ./gradlew patchChangelog
          fi

      # Bump the patch version. A maintainer can still choose a minor or major bump by hand
      # before the next release; this only guarantees the version is never a published one.
      - name: Bump Plugin Version
        id: bump
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          RELEASED="${TAG#v}"
          CURRENT="$(sed -n 's/^version = //p' gradle.properties)"

          if [ "$CURRENT" != "$RELEASED" ]; then
            echo "::notice::version is $CURRENT but $RELEASED was released — leaving it alone."
            exit 0
          fi

          NEXT="$(echo "$RELEASED" | awk -F. -v OFS=. '{ $3 += 1; print }')"
          sed -i "s/^version = .*/version = $NEXT/" gradle.properties
          echo "next=$NEXT" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Nothing to update after $VERSION."
            exit 0
          fi

          BRANCH="post-release-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b "$BRANCH"
          git commit -am "Post-release update - $VERSION"
          git push --set-upstream origin "$BRANCH"

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Post-release update - \`$VERSION\`" \
            --body "Files the \`$VERSION\` release notes in \`CHANGELOG.md\`${NEXT:+ and bumps \`version\` to \`$NEXT\`}." \
            --label "$LABEL" \
            --head "$BRANCH"
